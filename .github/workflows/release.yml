name: release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: docker-setup
        uses: docker/setup-buildx-action@v4

      - name: docker-login-dockerhub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: yankeguo
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: docker-login-ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker-login-quay
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: yankeguo
          password: ${{ secrets.QUAY_TOKEN }}

      - name: docker-meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            docker.io/yankeguo/nanollm
            ghcr.io/${{ github.repository }}
            quay.io/yankeguo/nanollm
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') && !startsWith(github.ref_name, 'v0.') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: docker-build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
